# NetLearn: English → Turkish terminology and style guide.
# Every translator (UI strings, lessons, quizzes, flashcards, glossary) follows this file.
# scripts/validate-content.ts warns when a Turkish file uses a form listed under `avoid`.
#
# ------------------------------------------------------------------------------------------------ style guide
# Audience: Unity developers new to networking. Tone: friendly, direct, technical; like modern Turkish developer
# docs, not a textbook.
#
# 1. Address the reader as "sen" (informal second person), consistently: "Bunu sunucuda doğrula.", "Göreceğin gibi…".
#    Never "siz", never impersonal passive chains ("…yapılmalıdır"). Imperatives in UI: "Başla", "Sonraki soru".
# 2. Hybrid terminology (decided by the course owner):
#    - Established Turkish words where they exist and developers use them: gecikme, paket kaybı, sunucu, istemci,
#      bant genişliği, güvenilir/güvenilmez teslim, sahiplik, yetki, serileştirme, enterpolasyon …
#    - Jargon and every API name stay English: tick, RPC, NetworkVariable, host, snapshot, spawn, jitter, relay …
#    - On the FIRST use in a lesson, give the other form in parentheses, exactly as in `firstUse` below:
#      "gecikme (latency)", "tick hızı (tick rate)", "snapshot (anlık durum görüntüsü)". Afterwards use `tr` alone.
# 3. Never translate code: identifiers, API names, attribute names, log strings, file names, menu paths of English-only
#    tools (Unity editor menus stay English: Window > Multiplayer > …). Code blocks stay byte-identical except that
#    comments MAY be translated. Inline `code` stays as is.
# 4. Keep every id, Term id, Sim/Diagram name, preset and variant, link path and anchor-free URL unchanged. Markdown
#    links keep their English paths ([güvenlik dersi](/modules/theory/security/)); the site adds /tr itself. In-lesson
#    #anchor links must use the Turkish heading slugs (check:links catches mistakes).
# 5. Suffixes on English words and acronyms follow pronunciation and take an apostrophe (Turkish typographic ’ or '):
#    UDP’de, TCP’nin, RPC’ler, NAT’ın, host’a, tick’ler, snapshot’lar, Unity’nin, Steam’in, NetworkVariable’ı.
# 6. Numbers: decimal comma (1,5 ms), thousands dot (10.000), percent sign first (%70), a space before units (16 ms).
#    In UI code use src/lib/i18n/format.ts instead of writing these by hand.
# 7. Avoid CSS-uppercased jargon (CSS turns "tick" into "TİCK" under lang="tr"); Turkish pages switch the uppercase
#    utility off automatically. Write all-caps words yourself when needed (e.g. canvas labels "KAÇTI").
# 8. Prefer short sentences. Don't calque English idioms; say what they mean ("fire and forget" → "gönder ve unut").
#    Keep **bold** and *italic* on the same ideas as the English text.
# 9. Fill-in quiz answers: keep the English accepted answers and ADD Turkish ones in the overlay (`answers`); matching
#    ignores case, Turkish i/ı/İ and diacritics.
#
# Entry fields: en, tr (form to use), keepEnglish (true: the English word itself is the Turkish term),
#               firstUse (form for the first mention in a lesson), avoid (forms not to use), note.

